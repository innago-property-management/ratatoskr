apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratatoskr
  labels:
    app.kubernetes.io/name: ratatoskr
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ratatoskr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ratatoskr
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: ratatoskr
          image: ghcr.io/innago-property-management/ratatoskr:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            # -- LLM provider config (choose one) --
            # - name: API_AGENT_PROVIDER
            #   value: "openai"
            # - name: OPENAI_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: ratatoskr-secrets
            #       key: openai-api-key
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
