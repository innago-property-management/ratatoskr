name: Release

on:
  release:
    types: [published]

# Publish to PyPI and GHCR in parallel on every GitHub Release.
# PyPI uses Trusted Publishing (OIDC) — no API tokens required.
# Docker pushes multi-arch images to ghcr.io with semver tags.

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build and publish Python package to PyPI
  # ──────────────────────────────────────────────
  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b  # v7.3.0
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        # No username/password needed — OIDC Trusted Publishing handles auth.
        # Configure the trusted publisher in PyPI project settings:
        #   https://docs.pypi.org/trusted-publishers/adding-a-publisher/

  # ──────────────────────────────────────────────
  # Job 2: Build and push multi-arch Docker image to GHCR
  # ──────────────────────────────────────────────
  publish-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Tag with full semver (e.g. 1.2.3)
            type=semver,pattern={{version}}
            # Tag with major.minor (e.g. 1.2)
            type=semver,pattern={{major}}.{{minor}}
            # Tag as latest
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7.0.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
