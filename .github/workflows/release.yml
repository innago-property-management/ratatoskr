name: Release

on:
  release:
    types: [published]

# Publish to PyPI and GHCR in parallel on every GitHub Release.
# PyPI uses Trusted Publishing (OIDC) — no API tokens required.
# Docker pushes multi-arch images to ghcr.io with semver tags.

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build and publish Python package to PyPI
  # ──────────────────────────────────────────────
  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No username/password needed — OIDC Trusted Publishing handles auth.
        # Configure the trusted publisher in PyPI project settings:
        #   https://docs.pypi.org/trusted-publishers/adding-a-publisher/

  # ──────────────────────────────────────────────
  # Job 2: Build and push multi-arch Docker image to GHCR
  # ──────────────────────────────────────────────
  publish-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Tag with full semver (e.g. 1.2.3)
            type=semver,pattern={{version}}
            # Tag with major.minor (e.g. 1.2)
            type=semver,pattern={{major}}.{{minor}}
            # Tag as latest
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
