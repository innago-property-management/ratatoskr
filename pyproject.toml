[project]
name = "api-agent"
version = "0.1.0"
description = "Universal MCP server for querying GraphQL and REST APIs using natural language"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "API Agent Contributors" }]
requires-python = ">=3.11"
keywords = ["mcp", "api", "graphql", "rest", "ai", "llm", "natural-language", "duckdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "anthropic>=0.83.0",
    "arize-otel>=0.11.0",
    "duckdb>=1.0.0",
    "fastmcp>=3.0.0",
    "httpx>=0.28.1",
    "openai>=1.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0.0",
    "starlette>=0.50.0",
    "uvicorn>=0.38.0",
]

[project.scripts]
api-agent = "api_agent.__main__:main"

[project.urls]
Homepage = "https://github.com/innago-property-management/ratatoskr"
Repository = "https://github.com/innago-property-management/ratatoskr"
Issues = "https://github.com/innago-property-management/ratatoskr/issues"
Changelog = "https://github.com/innago-property-management/ratatoskr/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
    "ty>=0.0.15",
]
